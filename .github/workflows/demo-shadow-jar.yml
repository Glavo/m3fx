name: Release Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run release check
        env:
          GRADLE_USER_HOME: .gradle-user-home
        run: xvfb-run -a ./gradlew releaseCheck --no-daemon

      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3fx-visual-reports
          path: |
            build/reports/m3fx-visual/
            demo/build/reports/m3fx-demo-visual/
          if-no-files-found: ignore
          archive: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3fx-test-reports
          path: |
            build/reports/tests/
            demo/build/reports/tests/
            build/test-results/test/
            demo/build/test-results/test/
          if-no-files-found: ignore
          archive: false

      - name: Upload shadow jar
        uses: actions/upload-artifact@v7
        with:
          name: m3fx-demo-shadow-jar
          path: demo/build/libs/m3fx-demo-*-shadow.jar
          if-no-files-found: error
          archive: false
