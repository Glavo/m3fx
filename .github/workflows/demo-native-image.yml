name: Build Demo Native Image

on:
  workflow_dispatch:
    inputs:
      nik_java_version:
        description: Liberica NIK Java feature version
        required: true
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  native-image:
    name: Native Demo (${{ matrix.target }}, NIK ${{ inputs.nik_java_version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            distribution: linux-x86_64
            executable: m3fx-demo
          - os: windows-latest
            target: windows
            distribution: windows-x86_64
            executable: m3fx-demo.exe
          - os: macos-latest
            target: macos
            distribution: macos-aarch64
            executable: m3fx-demo

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install Linux JavaFX build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libfreetype6-dev \
            libgl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            libx11-dev \
            libxtst-dev \
            zlib1g-dev

      - name: Set up the MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Liberica Native Image Kit Full
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: liberica
          java-version: ${{ inputs.nik_java_version }}
          java-package: jdk+fx
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
        run: ./gradlew nativeBuildDemo --no-daemon

      - name: Verify Windows native executable startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Resolve-Path 'demo/build/distributions/native/windows-x86_64/m3fx-demo.exe'
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "The native demo exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: m3fx-demo-native-${{ matrix.target }}
          path: demo/build/distributions/native/${{ matrix.distribution }}/${{ matrix.executable }}
          if-no-files-found: error
          archive: false
